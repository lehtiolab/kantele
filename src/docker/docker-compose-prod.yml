services:
    web:
        network_mode: host
        depends_on:
            - db
            - mq
        env_file:
            - ./prod-container.env
        logging:
            driver: syslog
            options:
                syslog-address: "${SYSLOG_ADDRESS}"
        environment:
            PROTOCOL: https
            DB_HOST: "${HOST_FQDN}"
            RABBITHOST: "${HOST_FQDN}"
            KANTELEHOST: "${HOST_FQDN}"
        volumes:
            - "${HOST_UPLOADPATH}:${CONTAINER_UPLOADPATH}"
            - "${HOST_ANALYSISFILES}:${CONTAINER_ANALYSISPATH}"
    
    nginx:
        network_mode: host
        depends_on:
            - web
        image: kantele_nginx # in prod-bake.yml
        volumes:
            - "${HOST_UPLOADPATH}:${CONTAINER_UPLOADPATH}"
            - "${HOST_ANALYSISFILES}:${CONTAINER_ANALYSISPATH}"
            - "${HOST_CERTBOT_PATH}/conf:/etc/letsencrypt"
            - "${HOST_CERTBOT_PATH}/www:/var/www/certbot"
        logging:
            driver: syslog
            options:
                syslog-address: "${SYSLOG_ADDRESS}"

    certbot:
      image: certbot/certbot
      volumes:
        - "${HOST_CERTBOT_PATH}/conf:/etc/letsencrypt"
        - "${HOST_CERTBOT_PATH}/www:/var/www/certbot"
          #entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"  # Renew certificates every 12 hours
    db: 
        network_mode: host
        logging:
            driver: syslog
            options:
                syslog-address: "${SYSLOG_ADDRESS}"
        volumes:
            - "${PG_DATA_PATH}:/var/lib/postgresql/data"
            - "${HOST_PG_BACKUPS}:${CONTAINER_BACKUPPATH}"


    mq:
        network_mode: host
        logging:
            driver: syslog
            options:
                syslog-address: "${SYSLOG_ADDRESS}"
        volumes:
          - type: bind
            source: "${HOST_KANTELEPATH}/src/docker/rabbitmq-timeout.conf"
            target: /etc/rabbitmq/conf.d/30-timeout.conf


    jobrunner:
        depends_on:
            - web
            - mq
        network_mode: host
        env_file:
            - ./prod-container.env
        logging:
            driver: syslog
            options:
                syslog-address: "${SYSLOG_ADDRESS}"
        environment:
            DB_HOST: "${HOST_FQDN}"
            RABBITHOST: "${HOST_FQDN}"
