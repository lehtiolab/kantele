
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log debug;
pid        /var/run/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    keepalive_timeout  65;

    #gzip  on;

    # do not include default configs here
    # include /etc/nginx/conf.d/*.conf;

    upstream django {
        # server unix:///path/to/your/mysite/mysite.sock; # for a file socket
        server web:8010; # for a web port socket
    }

    server {
        listen         80;
        server_name localhost;

        location /static {
            alias /static; 
        }

        location /uploads {
            alias /uploads;
        }

        # max upload size
        client_max_body_size 20M;   # adjust to taste

        location /analysisfiles {
            internal;
            alias /analysisfiles;
        }
        location /task_downloads/storage {
            internal;
            alias /download_storage/newstorage ;
        }
        location /task_downloads/library {
            internal;
            alias /download_storage/library ;
        }
        location /task_downloads/analysis {
            internal;
            alias /download_storage/analysis ;
        }

        location / {
            proxy_pass  http://django;
	    proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Port  $server_port;

	    #include     /etc/nginx/uwsgi_params; # the uwsgi_params file you installed
        }
    }
}
