--- 
# Deploy kantele web system

- hosts: kantele
  become: yes
  become_user: '{{ kanteleuser }}'
  tasks:
      - name: Clone repo
        ansible.builtin.git:
            repo: '{{ kantele_repo }}'
            dest: '{{ kanteledir }}'
            version: master

      - name: Deploy templates with env variables for compose script and container insides
        ansible.builtin.template:
            src: '{{ item[0] }}'
            dest: '{{ item[1] }}'
        loop:
            - ['.compose.prod.env.j2', '{{ compose_env_file }}']
            - ['docker-compose-prod.yml.j2', '{{ kanteledir }}/src/docker/docker-compose-prod.yml']
            - ['container_env_vars.j2', '{{ kanteledir }}/prod-container.env']
            - ['nginx_prod.conf.j2', '{{ kanteledir }}/src/docker/nginx.conf']

      - name: Create credential path for storage mounts
        become: yes
        file:
            path: "{{ mount_cred | dirname }}"
            state: directory
            owner: root
            group: root
      
      - name: Deploy cifs credentials
        become: yes
        template:
            src: cifs_credentials.j2
            dest: "{{ mount_cred }}"
            mode: 0400

      - name: Mount storage for downloading files from
        become: yes
        mount:
            path: "{{ item.0 }}"
            src: "{{ item.1 }}"
            state: mounted
            fstype: cifs
            opts: "credentials={{ mount_cred }},uid={{ kanteleuser }},domain={{ mount_domain }},iocharset=utf8,vers=3.0,_netdev,ro"
       loop: "{{ storagedirs | zip(storageservers) | list }}"
      
      - name: Build compose images
        ansible.builtin.command:
            cmd: "docker buildx bake --file src/docker/prod-bake.yml"
            chdir: "{{ kanteledir }}"
        environment:
            - USER_ID: '{{ kanteleuid }}'
            - GROUP_ID: '{{ kantelegid }}'

      - name: Start production docker containers
        community.docker.docker_compose_v2:
            project_src: '{{ kanteledir }}'
            project_name: 'kantele'
            files:
                - '{{ kanteledir }}/src/docker/docker-compose-base.yml'
                - '{{ kanteledir }}/src/docker/docker-compose-prod.yml'
            env_files:
              - '{{ compose_env_file }}'
            build: never
            recreate: always

      - name: Perform any outstanding migrations
        ansible.builtin.command:
            cmd: "docker compose --env-file {{ compose_env_file }} -f src/docker/docker-compose-base.yml -f src/docker/docker-compose-prod.yml --project-name kantele exec web python manage.py migrate"
            chdir: "{{ kanteledir }}"
        
         
      - name: Cron job for downloading ENSEMBL/swiss fasta
        ansible.builtin.cron:
            name: Schedule job to download new FASTA
            minute: "0"
            hour: "*/4"
            job: "cd {{ kanteledir }} && docker compose --env-file {{ compose_env_file }} -f src/docker/docker-compose-base.yml -f src/docker/docker-compose-prod.yml --project-name kantele exec -T web python manage.py download_latest_fasta "

